name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx biome check .
      - run: npm test
      - run: npm run test:perf
      - run: npm run build
      # A real VS Code (the oldest supported version) needs a display on Linux.
      - name: Integration (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Integration (Windows, macOS)
        if: runner.os != 'Linux'
        run: npm run test:integration

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      # Test exactly what ships: the unpacked .vsix in a real VS Code.
      - name: Integration on the packaged extension
        run: |
          mkdir -p /tmp/vsix && unzip -q dist/*.vsix -d /tmp/vsix
          ORBIT_IT_EXTENSION=/tmp/vsix/extension xvfb-run -a node test/integration/runTest.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-vsix
          path: dist/*.vsix

  # A version tag (v1.2.3) publishes the tested package to both stores.
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: orbit-vsix
          path: dist
      - name: Open VSX (Cursor, Windsurf, VSCodium…)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx publish dist/*.vsix --skip-duplicate
      - name: Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT isn't set, so the Marketplace wasn't updated. Upload the .vsix by hand."
            exit 0
          fi
          npx --yes @vscode/vsce publish --packagePath dist/*.vsix --skip-duplicate
